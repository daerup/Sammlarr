name: Build the image
description: The one image build that the release, its rebuild check and the image scan share, so all three get the same inputs
inputs:
  version:
    description: Version stamped into the app
    default: 0.0.0-local
  labels:
    description: OCI labels
    default: ''
  tags:
    description: Image tags
    default: ''
  platforms:
    description: Platforms to build
    default: linux/amd64,linux/arm64
  outputs:
    description: BuildKit outputs
    required: true
  cache:
    description: Read and write the GitHub Actions build cache
    default: 'true'
outputs:
  digest:
    description: Digest of the built image
    value: ${{ steps.build.outputs.digest }}
  buildkit:
    description: BuildKit version that built it
    value: ${{ steps.buildkit.outputs.value }}
  epoch:
    description: SOURCE_DATE_EPOCH it was built with
    value: ${{ steps.epoch.outputs.value }}
runs:
  using: composite
  steps:
    - id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

    - id: buildkit
      shell: bash
      env:
        NODES: ${{ steps.buildx.outputs.nodes }}
      run: echo "value=$(jq -r '.[0].buildkit' <<< "$NODES")" >> "$GITHUB_OUTPUT"

    - id: epoch
      shell: bash
      run: echo "value=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
      with:
        context: .
        file: src/Web/Dockerfile
        platforms: ${{ inputs.platforms }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: |
          VERSION=${{ inputs.version }}
          SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
        provenance: false
        sbom: false
        no-cache: ${{ inputs.cache != 'true' }}
        cache-from: ${{ inputs.cache == 'true' && 'type=gha' || '' }}
        cache-to: ${{ inputs.cache == 'true' && 'type=gha,mode=max' || '' }}
        outputs: ${{ inputs.outputs }}
