name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'
  DOTNET_NOLOGO: 'true'
  TUNIT_DISABLE_GITHUB_REPORTER: 'true'
  TUNIT_DISABLE_HTML_REPORTER: 'true'
  CONFIGURATION: ${{ startsWith(github.head_ref, 'release-please--') && 'Release' || 'Debug' }}

jobs:
  build-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      line: ${{ steps.line.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: dotnet tool restore

      - id: restore
        run: dotnet restore Sammlarr.slnx --locked-mode

      - run: dotnet build Sammlarr.slnx -c "$CONFIGURATION" --no-restore -warnaserror '-warnNotAsError:NU1900;NU1901;NU1902;NU1903;NU1904'

      - name: Fast test tiers
        run: |
          status=0
          for tier in Domain Shared Core API Integration UI Web Architecture Roslyn; do
            dotnet run --project "tests/$tier" --no-build -c "$CONFIGURATION" -- \
              --coverage --coverage-output-format cobertura --coverage-output "$tier.cobertura.xml" \
              --coverage-settings "$GITHUB_WORKSPACE/.github/coverage.xml" \
              --report-trx --report-trx-filename "$RUNNER_TEMP/test-results/$tier.trx" || status=1
          done
          exit $status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 7

      - name: Coverage
        run: >
          dotnet tool run reportgenerator
          "-reports:tests/**/TestResults/*.cobertura.xml"
          -targetdir:coverage
          "-reporttypes:Html;MarkdownSummaryGithub;TextSummary;JsonSummary;Cobertura"
          "-assemblyfilters:-JasperFx*;-Harness;-TestInfrastructure"
          "-classfilters:-DB.Migrations.*"
          "minimumCoverageThresholds:lineCoverage=80"

      - name: Coverage summary
        if: always()
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Line coverage
        id: line
        if: always()
        run: echo "value=$(jq '.summary.linecoverage // empty' coverage/Summary.json)" >> "$GITHUB_OUTPUT" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

      - run: dotnet csharpier check .

      - name: Licences
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: >
          dotnet nuget-license -i src/Web/Web.csproj -t -o Table -err
          -a .github/licences/allowed.json
          -override .github/licences/overrides.json

      - name: Vulnerable packages
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          dotnet list Sammlarr.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          jq '{ problems, vulnerable: [.projects[] | select(.frameworks)] }' vulnerable.json
          jq -e '([.projects[].frameworks[]?] | length == 0) and ((.problems // []) | length == 0)' vulnerable.json

  badges:
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build-test.outputs.line != '' }}
    needs: [build-test, test-report]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    concurrency:
      group: badges
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage

      - name: Badges on the badges branch
        env:
          LINE: ${{ needs.build-test.outputs.line }}
          PASSED: ${{ needs.test-report.outputs.passed }}
          FAILED: ${{ needs.test-report.outputs.failed }}
        run: |
          [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ] || exit 0
          colour=$(awk -v line="$LINE" 'BEGIN { print (line >= 90 ? "green" : (line >= 80 ? "yellow" : "red")) }')
          if git fetch --depth 1 origin badges; then git switch -c badges FETCH_HEAD; else git switch --orphan badges; fi
          printf '{ "schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s" }\n' "$LINE" "$colour" > coverage.json
          cp "$RUNNER_TEMP/coverage/SummaryGithub.md" coverage.md
          git add coverage.json coverage.md
          if [ -n "$PASSED" ]; then
            if [ "${FAILED:-0}" -gt 0 ]; then tests="$FAILED failed, $PASSED passed" tests_colour=red; else tests="$PASSED passed" tests_colour=green; fi
            printf '{ "schemaVersion": 1, "label": "tests", "message": "%s", "color": "%s" }\n' "$tests" "$tests_colour" > tests.json
            git add tests.json
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "coverage $LINE%${tests:+, tests $tests}" || exit 0
          git push origin badges

  coverage-comment:
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]' && needs.build-test.outputs.line != '' }}
    needs: build-test
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Main's coverage
        id: main
        run: |
          if git fetch --depth 1 origin badges; then
            echo "value=$(git show FETCH_HEAD:coverage.json | jq -r '.message')" >> "$GITHUB_OUTPUT"
          else
            echo "value=not measured yet" >> "$GITHUB_OUTPUT"
          fi

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          message: |
            Line coverage **${{ needs.build-test.outputs.line }}%** (main: ${{ steps.main.outputs.value }}). Full report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  reproducible:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Publish twice from a clean tree
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          export SOURCE_DATE_EPOCH
          for run in 1 2; do
            git clean -xdfq
            dotnet restore src/Web/Web.csproj --locked-mode
            for arch in x64 arm64; do
              dotnet publish src/Web/Web.csproj -c Release -a "$arch" --self-contained false --no-restore -o "$RUNNER_TEMP/publish/$run/$arch" \
                -p:ExcludeStaging=true -p:ContinuousIntegrationBuild=true -p:DebugType=none
            done
          done

      - name: Compare
        id: compare
        run: |
          cd "$RUNNER_TEMP"
          (cd publish/1 && find . -type f -exec sha256sum {} + | sort -k2) > hashes-1.txt
          (cd publish/2 && find . -type f -exec sha256sum {} + | sort -k2) > hashes-2.txt
          echo "$(wc -l < hashes-1.txt) files"
          diff hashes-1.txt hashes-2.txt

      - name: Diffoscope
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends diffoscope
          diffoscope --html "$RUNNER_TEMP/diffoscope.html" "$RUNNER_TEMP/publish/1" "$RUNNER_TEMP/publish/2" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.compare.outcome == 'failure'
        with:
          name: reproducibility
          path: |
            ${{ runner.temp }}/diffoscope.html
            ${{ runner.temp }}/hashes-*.txt
          retention-days: 7

  trivy-image:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-image
        with:
          platforms: linux/amd64
          tags: sammlarr:scan
          outputs: type=docker

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: sammlarr:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          version: v0.76.1
          image-ref: sammlarr:scan
          scanners: vuln
          format: sarif
          output: trivy-image.sarif

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  trivy-repo:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        scan: [fs, config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: ${{ matrix.scan }}
          scan-ref: .
          format: sarif
          output: trivy-${{ matrix.scan }}.sarif

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.scan }}.sarif
          category: trivy-${{ matrix.scan }}

  e2e:
    if: startsWith(github.head_ref, 'release-please--') || startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: dotnet tool restore

      - run: dotnet restore Sammlarr.slnx --locked-mode

      - run: dotnet build tests/E2E -c "$CONFIGURATION" --no-restore

      - run: pwsh "tests/E2E/bin/$CONFIGURATION/net11.0/playwright.ps1" install --with-deps chromium

      - run: >
          PUID=$(id -u) PGID=$(id -g) dotnet run --project tests/E2E --no-build -c "$CONFIGURATION" --
          --report-trx --report-trx-filename "$RUNNER_TEMP/test-results/E2E.trx"
        env:
          E2E_RESOURCE_LOG: ${{ runner.temp }}/test-results/stacks

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-e2e
          path: ${{ runner.temp }}/test-results
          retention-days: 7

  test-report:
    if: ${{ !cancelled() }}
    needs: [build-test, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      passed: ${{ steps.report.outputs.passed }}
      failed: ${{ steps.report.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results*
          merge-multiple: true

      - id: report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: tests
          path: '*.trx'
          reporter: dotnet-trx
          list-tests: failed
          fail-on-error: 'false'
          fail-on-empty: 'false'
