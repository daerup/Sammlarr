name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      epoch: ${{ steps.build.outputs.epoch }}
      attestation: ${{ steps.provenance.outputs.attestation-url }}
      version: ${{ steps.version.outputs.version }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u -d "@$(git log -1 --pretty=%ct)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/daerup/sammlarr
          flavor: latest=false
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.created=${{ steps.version.outputs.created }}

      - id: build
        uses: ./.github/actions/build-image
        with:
          version: ${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/daerup/sammlarr,push-by-digest=true,push=true,oci-mediatypes=true,rewrite-timestamp=true

      - name: Provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/daerup/sammlarr
          subject-digest: ${{ steps.build.outputs.digest }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet tool restore

      - name: App SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet CycloneDX src/Web/Web.csproj -ed -o sbom -fn sammlarr-app.cdx.json -F Json -sn Sammlarr -sv "$VERSION"

      - name: Image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.76.0
          image-ref: ghcr.io/daerup/sammlarr@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom/sammlarr-image.cdx.json

      - name: SBOMs, provenance and notices for the release
        env:
          IMAGE: ghcr.io/daerup/sammlarr@${{ steps.build.outputs.digest }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          container=$(docker create "$IMAGE")
          docker cp "$container:/app/THIRD-PARTY-NOTICES.txt" sbom/
          docker rm "$container"
          cp "$BUNDLE" sbom/sammlarr-image.intoto.jsonl
          gh release upload "$GITHUB_REF_NAME" sbom/sammlarr-app.cdx.json sbom/sammlarr-image.cdx.json sbom/sammlarr-image.intoto.jsonl sbom/THIRD-PARTY-NOTICES.txt --clobber

  rebuild:
    needs: image
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    outputs:
      buildkit: ${{ steps.build.outputs.buildkit }}
      digest: ${{ steps.compare.outputs.rebuilt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: build
        uses: ./.github/actions/build-image
        with:
          version: ${{ needs.image.outputs.version }}
          labels: ${{ needs.image.outputs.labels }}
          cache: 'false'
          outputs: type=oci,dest=${{ runner.temp }}/rebuilt-layout,tar=false,oci-mediatypes=true,rewrite-timestamp=true

      - name: Compare with the pushed image
        id: compare
        env:
          PUSHED: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          skopeo inspect --raw --retry-times 3 --creds "$GITHUB_ACTOR:$GH_TOKEN" "docker://ghcr.io/daerup/sammlarr@$PUSHED" > pushed-index.json
          rebuilt=$(jq -r '.manifests[0].digest' rebuilt-layout/index.json)
          echo "rebuilt=$rebuilt" >> "$GITHUB_OUTPUT"
          rebuilt_index="rebuilt-layout/blobs/sha256/${rebuilt#sha256:}"
          unpack() {
            mkdir -p "$3"
            cp "$1" "$3/manifest.json"
            cp "$2/$(jq -r '.config.digest | sub("sha256:"; "")' "$1")" "$3/config.json"
            for layer in $(jq -r '.layers[].digest | sub("sha256:"; "")' "$1"); do
              if tar -tf "$2/$layer" | grep '^app/' > /dev/null; then tar -xf "$2/$layer" -C "$3" app; fi
            done
            (cd "$3/app" && find . -type f -exec sha256sum {} + | sort -k2) > "$3.txt"
          }
          platform='.manifests[] | select(.platform.architecture == $arch) | .digest'
          mkdir -p pushed-layout pushed rebuilt
          cp pushed-index.json pushed/index.json
          cp "$rebuilt_index" rebuilt/index.json
          for arch in $(jq -r '.manifests[].platform.architecture' pushed-index.json); do
            pushed_manifest=$(jq -r --arg arch "$arch" "$platform" pushed-index.json)
            rebuilt_manifest=$(jq -r --arg arch "$arch" "$platform" "$rebuilt_index")
            skopeo copy -q --retry-times 3 --src-creds "$GITHUB_ACTOR:$GH_TOKEN" "docker://ghcr.io/daerup/sammlarr@$pushed_manifest" "dir:pushed-layout/$arch"
            unpack "pushed-layout/$arch/manifest.json" "pushed-layout/$arch" "pushed/$arch"
            unpack "rebuilt-layout/blobs/sha256/${rebuilt_manifest#sha256:}" rebuilt-layout/blobs/sha256 "rebuilt/$arch"
            echo "$arch: pushed $pushed_manifest, rebuilt $rebuilt_manifest, $(wc -l < "pushed/$arch.txt") files in /app"
            diff "pushed/$arch.txt" "rebuilt/$arch.txt"
          done
          echo "pushed $PUSHED, rebuilt $rebuilt"
          test "$rebuilt" = "$PUSHED" || { echo "::error::rebuilt $rebuilt, pushed $PUSHED"; exit 1; }

      - name: Diffoscope
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends diffoscope
          diffoscope --html "$RUNNER_TEMP/diffoscope.html" "$RUNNER_TEMP/pushed" "$RUNNER_TEMP/rebuilt" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.compare.outcome == 'failure'
        with:
          name: rebuild
          path: |
            ${{ runner.temp }}/diffoscope.html
            ${{ runner.temp }}/pushed/*.txt
            ${{ runner.temp }}/rebuilt/*.txt
            ${{ runner.temp }}/pushed/index.json
            ${{ runner.temp }}/rebuilt/index.json
          retention-days: 7

  publish:
    needs: [image, notes]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the release and move latest to it
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.image.outputs.version }}
        run: docker buildx imagetools create --prefer-index=false --tag "ghcr.io/daerup/sammlarr:$VERSION" --tag ghcr.io/daerup/sammlarr:latest "ghcr.io/daerup/sammlarr@$DIGEST"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  notes:
    needs: [image, rebuild]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: read
      attestations: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image section on the release
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.image.outputs.version }}
          EPOCH: ${{ needs.image.outputs.epoch }}
          ATTESTATION: ${{ needs.image.outputs.attestation }}
          REBUILT: ${{ needs.rebuild.outputs.digest }}
          BUILDKIT: ${{ needs.rebuild.outputs.buildkit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          security="https://github.com/$GITHUB_REPOSITORY/blob/main/SECURITY.md#verifying-what-you-run"
          image="\`ghcr.io/daerup/sammlarr:$VERSION\`"
          page=$(gh api --paginate "users/$GITHUB_REPOSITORY_OWNER/packages/container/sammlarr/versions" --jq ".[] | select(.name == \"$DIGEST\") | .html_url" || true)
          if [ -n "$page" ]; then image="[$image]($page)"; else echo "::warning::no package version found for $DIGEST"; fi
          previous=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          previous=${previous#v}
          kept="so the release stays a draft and \`:latest\` on ${previous:-the previous release}"
          ok=true
          if [ "$REBUILT" = "$DIGEST" ]; then
            reproducible="✅ **Reproducible**: rebuilt without cache to the same digest, with BuildKit $BUILDKIT, \`VERSION=$VERSION\` and \`SOURCE_DATE_EPOCH=$EPOCH\` ([how to repeat it]($security))"
          elif [ -n "$REBUILT" ]; then
            reproducible="❌ **Reproducible**: a rebuild without cache got \`$REBUILT\`, $kept" ok=false
          else
            reproducible="❌ **Reproducible**: the rebuild without cache did not finish, $kept" ok=false
          fi
          if gh attestation verify "oci://ghcr.io/daerup/sammlarr@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF" --deny-self-hosted-runners; then
            attested="✅ **Attested**: the [build provenance]($ATTESTATION) verifies as built by \`release.yml\` from \`$GITHUB_REF_NAME\` on a GitHub-hosted runner ([how to verify it]($security))"
          else
            attested="❌ **Attested**: no valid build provenance found for this digest, $kept" ok=false
          fi
          notes=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          gh release edit "$GITHUB_REF_NAME" --notes "$notes

          ### Image

          $image for linux/amd64 and linux/arm64, index digest \`$DIGEST\`

          * $reproducible
          * $attested"
          $ok || { echo "::error::a release check failed, so the release stays a draft"; exit 1; }
