name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          epoch=$(git log -1 --pretty=%ct)
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/daerup/sammlarr
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.created=${{ steps.version.outputs.created }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
        with:
          context: .
          file: Web/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.version.outputs.epoch }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push=true,rewrite-timestamp=true

      - name: Image size budget
        env:
          IMAGE: ghcr.io/daerup/sammlarr@${{ steps.build.outputs.digest }}
          BUDGET_MB: '101'
        run: |
          size=$(docker buildx imagetools inspect "$IMAGE" --raw | jq '[.layers[].size] | add')
          echo "Compressed image: $((size / 1048576)) MB, budget ${BUDGET_MB} MB"
          test "$size" -le $((BUDGET_MB * 1048576))

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: dotnet tool restore

      - name: Compose file for the release
        env:
          ImageTag: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet aspire publish --apphost AppHost --output-path aspire-output --non-interactive --nologo
          gh release upload "$GITHUB_REF_NAME" aspire-output/docker-compose.yaml --clobber

      - name: App SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet CycloneDX Web/Web.csproj -ed -o sbom -fn sammlarr-app.cdx.json -F Json -sn Sammlarr -sv "$VERSION"

      - name: Image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ghcr.io/daerup/sammlarr@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom/sammlarr-image.cdx.json

      - name: SBOMs and notices for the release
        env:
          IMAGE: ghcr.io/daerup/sammlarr@${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          container=$(docker create "$IMAGE")
          docker cp "$container:/app/THIRD-PARTY-NOTICES.txt" sbom/
          docker rm "$container"
          gh release upload "$GITHUB_REF_NAME" sbom/sammlarr-app.cdx.json sbom/sammlarr-image.cdx.json sbom/THIRD-PARTY-NOTICES.txt --clobber
