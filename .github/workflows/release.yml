name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u -d "@$(git log -1 --pretty=%ct)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/daerup/sammlarr
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.created=${{ steps.version.outputs.created }}

      - id: build
        uses: ./.github/actions/build-image
        with:
          version: ${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push=true,oci-mediatypes=true,rewrite-timestamp=true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet tool restore

      - name: App SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet CycloneDX Web/Web.csproj -ed -o sbom -fn sammlarr-app.cdx.json -F Json -sn Sammlarr -sv "$VERSION"

      - name: Image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ghcr.io/daerup/sammlarr@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom/sammlarr-image.cdx.json

      - name: SBOMs and notices for the release
        env:
          IMAGE: ghcr.io/daerup/sammlarr@${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          container=$(docker create "$IMAGE")
          docker cp "$container:/app/THIRD-PARTY-NOTICES.txt" sbom/
          docker rm "$container"
          gh release upload "$GITHUB_REF_NAME" sbom/sammlarr-app.cdx.json sbom/sammlarr-image.cdx.json sbom/THIRD-PARTY-NOTICES.txt --clobber

  rebuild:
    needs: image
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    outputs:
      buildkit: ${{ steps.build.outputs.buildkit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: build
        uses: ./.github/actions/build-image
        with:
          version: ${{ needs.image.outputs.version }}
          labels: ${{ needs.image.outputs.labels }}
          cache: 'false'
          outputs: type=oci,dest=${{ runner.temp }}/rebuilt-layout,tar=false,oci-mediatypes=true,rewrite-timestamp=true

      - name: Compare with the pushed image
        id: compare
        env:
          PUSHED: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          skopeo copy -q --retry-times 3 --src-creds "$GITHUB_ACTOR:$GH_TOKEN" "docker://ghcr.io/daerup/sammlarr@$PUSHED" dir:pushed-layout
          rebuilt=$(jq -r '.manifests[0].digest' rebuilt-layout/index.json)
          unpack() {
            mkdir -p "$3"
            cp "$1" "$3/manifest.json"
            cp "$2/$(jq -r '.config.digest | sub("sha256:"; "")' "$1")" "$3/config.json"
            for layer in $(jq -r '.layers[].digest | sub("sha256:"; "")' "$1"); do
              if tar -tf "$2/$layer" | grep '^app/' > /dev/null; then tar -xf "$2/$layer" -C "$3" app; fi
            done
            (cd "$3/app" && find . -type f -exec sha256sum {} + | sort -k2) > "$3.txt"
          }
          unpack pushed-layout/manifest.json pushed-layout pushed
          unpack "rebuilt-layout/blobs/sha256/${rebuilt#sha256:}" rebuilt-layout/blobs/sha256 rebuilt
          echo "pushed $PUSHED, rebuilt $rebuilt, $(wc -l < pushed.txt) files in /app"
          diff pushed.txt rebuilt.txt
          test "$rebuilt" = "$PUSHED" || { echo "::error::rebuilt $rebuilt, pushed $PUSHED"; exit 1; }

      - name: Diffoscope
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends diffoscope
          diffoscope --html "$RUNNER_TEMP/diffoscope.html" "$RUNNER_TEMP/pushed" "$RUNNER_TEMP/rebuilt" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.compare.outcome == 'failure'
        with:
          name: rebuild
          path: |
            ${{ runner.temp }}/diffoscope.html
            ${{ runner.temp }}/pushed.txt
            ${{ runner.temp }}/rebuilt.txt
          retention-days: 7

  reproduced:
    needs: [image, rebuild]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Note the matching rebuild on the release
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          BUILDKIT: ${{ needs.rebuild.outputs.buildkit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          gh release edit "$GITHUB_REF_NAME" --notes "$notes

          Reproduced on a fresh runner without cache: \`$DIGEST\` matches (BuildKit $BUILDKIT)."
