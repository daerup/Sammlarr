services:
  sammlarr:
    image: ghcr.io/daerup/sammlarr:latest
    # Runs as uid 1654, PUID/PGID environment variables are ignored. For a bind mount like ./data:/data,
    # uncomment with the folder owner's ids below, or chown -R 1654:1654 ./data.
    # user: "1000:1000"
    ports:
      - "6769:6769"
    volumes:
      - sammlarr-data:/data
    environment:
      - TZ=Etc/UTC
      # Behind a reverse proxy: the address you open Sammlarr at, e.g. https://sammlarr.example.com,
      # so Plex sends you back there after signing in; Plex sign-in then works only at that address.
      # Empty uses the address the request came in on.
      - Sammlarr__PublicUrl=
      # Take each visitor's address (and https) from the reverse proxy's X-Forwarded-For and -Proto headers, so
      # Sammlarr's request limits count per visitor, not per proxy. With no proxy in front, set it to false.
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    restart: unless-stopped

volumes:
  sammlarr-data:
    name: sammlarr-data
